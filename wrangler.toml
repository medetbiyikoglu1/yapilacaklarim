name = "yapilacaklarim"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "yapilacaklarim"
# `npx wrangler d1 create yapilacaklarim` komutunun verdiği id'yi buraya yapıştır.
database_id = "BURAYA_D1_ID"

# Her dakika vadesi gelen hatırlatmaları gönderir.
[triggers]
crons = ["* * * * *"]

[vars]
VAPID_SUBJECT = "mailto:sen@ornek.com"
# VAPID_PUBLIC_KEY ve VAPID_PRIVATE_JWK `wrangler secret put` ile girilir.
